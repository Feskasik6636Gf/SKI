name: Render video
on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition id (StyleDemo / Doodle)'
        default: 'StyleDemo'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx remotion render src/index.ts ${{ inputs.composition }} out/video.mp4 --gl=swangle
      - uses: actions/upload-artifact@v4
        with: {name: video, path: out/video.mp4}
