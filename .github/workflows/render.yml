name: Render video
on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition id (Story3 / Story2 / Story / StyleDemo / Doodle)'
        default: 'Story3'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx remotion render src/index.ts ${{ inputs.composition }} out/video.mp4 --gl=swangle --concurrency=4 --crf=18
      - uses: actions/upload-artifact@v4
        with: {name: video, path: out/video.mp4}
      - name: Commit rendered video to drafts/
        run: |
          mkdir -p drafts
          cp out/video.mp4 drafts/${{ inputs.composition }}_render.mp4
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add drafts/${{ inputs.composition }}_render.mp4
          git commit -m "Add rendered ${{ inputs.composition }} video" || exit 0
          git push
